name: flutter_netdiag_plus
description: "Detailed network diagnostics for Flutter: DNS lookup, TCP connect, HTTP RTT, multi-target ping, traceroute (Android NDK + native iOS)."
version: 1.0.1
homepage: https://github.com/MrTuyennn/flutter_netdiag_plus
repository: https://github.com/MrTuyennn/flutter_netdiag_plus
issue_tracker: https://github.com/MrTuyennn/flutter_netdiag_plus/issues

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.netdiag.flutter_netdiag_plus
        pluginClass: FlutterNetdiagPlusPlugin
      ios:
        pluginClass: FlutterNetdiagPlusPlugin
