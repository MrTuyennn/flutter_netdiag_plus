name: flutter_netdiag_plus
description: "Đo lường mạng chi tiết cho Flutter: DNS lookup, TCP connect, HTTP RTT, ping nhiều đích, traceroute (Android NDK + iOS native)."
version: 0.1.0
homepage:

environment:
  sdk: ^3.13.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.netdiag.flutter_netdiag_plus
        pluginClass: FlutterNetdiagPlusPlugin
      ios:
        pluginClass: FlutterNetdiagPlusPlugin
